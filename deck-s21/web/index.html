<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>Deck</title>
<style>
  :root {
    --bg: #0a0a0c; --btn: #16171b; --btn-hi: #1f2126; --line: #25272d;
    --text: #f2f3f5; --label: #c4c8d2; --muted: #7c8190;
    --accent: #f2f3f5; --ok: #3ecf8e; --err: #ff5a5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }
  #app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 44px; border-bottom: 1px solid var(--line); }
  #now { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--muted); font-size: 14px; letter-spacing: .2px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.ok { background: var(--ok); } #dot.bad { background: var(--err); }
  #full { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 4px 8px; }
  #grid { display: grid; gap: 10px; padding: 14px 16px; overflow-y: auto;
    grid-template-columns: repeat(auto-fill, minmax(var(--bw, 150px), 1fr)); grid-auto-rows: var(--bh, 128px); align-content: start; }
  .btn { --c: var(--accent); background: var(--btn); border: 1px solid var(--line); border-radius: 18px; color: var(--label);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font-size: 13px; font-weight: 500; padding: 8px; transition: transform .08s, background .15s, border-color .15s; }
  .btn .ic { font-size: calc(var(--ic, 46px) * .7); line-height: 1; height: var(--ic, 46px); display: flex; align-items: center; justify-content: center; }
  .btn .ic img { width: var(--ic, 46px); height: var(--ic, 46px); object-fit: contain; }
  .btn .ic .sym { display: block; width: calc(var(--ic, 46px) * .72); height: calc(var(--ic, 46px) * .72); background: var(--text);
    -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .no-labels .btn .lb { display: none; }
  /* imagem de fundo: o fundo escurece e as superfícies ficam translúcidas */
  html.has-bg body { background: linear-gradient(rgba(10, 10, 12, var(--dim, .5)), rgba(10, 10, 12, var(--dim, .5))), var(--bg-img);
    background-size: cover; background-position: center; background-repeat: no-repeat; }
  html.has-bg { --btn: rgba(24, 25, 30, .58); --btn-hi: rgba(48, 50, 58, .7); --line: rgba(255, 255, 255, .13); }
  html.has-bg .btn, html.has-bg .card, html.has-bg header, html.has-bg nav { -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  html.has-bg header, html.has-bg nav { background: rgba(10, 10, 12, .35); }
  .btn:active { transform: scale(.97); background: var(--btn-hi); }
  .btn.on { --a: var(--on, var(--c)); border-color: var(--a); color: var(--text);
    background: color-mix(in srgb, var(--a) 18%, var(--btn)); }
  .btn.flash-ok { border-color: var(--ok); } .btn.flash-err { border-color: var(--err); }
  #grid.info { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); grid-auto-rows: auto; align-items: stretch; }
  .card { background: var(--btn); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; overflow: hidden; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .clock { font-size: 44px; font-weight: 300; line-height: 1; letter-spacing: 1px; }
  .date { margin-top: 6px; color: var(--label); font-size: 14px; }
  .date::first-letter { text-transform: uppercase; }
  .wx { margin-top: 10px; }
  .wxmain { font-size: 16px; line-height: 1.25; }
  .dim { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .errtxt { color: var(--err); font-size: 13px; }
  .row { margin: 14px 0 0; }
  .rowtop { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 14px; }
  .lbl { color: var(--label); } .val { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; border-radius: 4px; background: var(--btn-hi); overflow: hidden; }
  .fill { height: 100%; background: var(--text); border-radius: 4px; transition: width .4s; } .fill.hot { background: var(--err); }
  .sess { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .sess .nm, .evt .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .dim { margin: 0; font-size: 12px; }
  .evt { margin: 8px 0; font-size: 14px; }
  .evt .nm { display: block; }
  .dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; } .dotc.work { background: var(--ok); }
  .sep { height: 1px; background: var(--line); margin: 10px 0 8px; }
  .win { font-size: 14px; margin: 2px 0; }
  .when { display: block; color: var(--muted); font-size: 12px; margin-bottom: 1px; }
  .cd { font-size: 24px; font-weight: 300; margin: 0 0 4px; }
  .nxt { font-size: 15px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-top: 8px; }
  .kv .k { color: var(--label); } .kv .v { color: var(--muted); text-align: right; }
  .mus { display: flex; gap: 14px; }
  .art { width: 112px; height: 112px; flex: none; border-radius: 12px; background: var(--btn-hi); display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; }
  .mi { flex: 1; min-width: 0; }
  .mt { font-size: 17px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ma { color: var(--label); font-size: 14px; margin-top: 2px; }
  .prog { height: 4px; border-radius: 2px; background: var(--btn-hi); margin-top: 12px; overflow: hidden; }
  .prog .fill { border-radius: 2px; transition: none; }
  .times { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .rem { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
  .rem .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rem .dim { margin: 0; font-size: 12px; } .rem.late .dotc { background: var(--err); } .rem.late .dim { color: var(--err); }
  nav { display: flex; gap: 4px; padding: 0 8px; border-top: 1px solid var(--line); overflow-x: auto; }
  nav button { flex: 1; min-width: 90px; background: transparent; border: 0; border-top: 2px solid transparent; margin-top: -1px;
    color: var(--muted); font-size: 14px; font-weight: 500; padding: 14px 8px; }
  nav button.active { color: var(--text); border-top-color: var(--text); }
  #toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); max-width: 90vw;
    background: var(--btn-hi); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; } #toast.err { background: #2a1417; border-color: var(--err); }
  #pair { margin: auto; padding: 24px; text-align: center; grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #pair p { margin: 0; color: var(--muted); }
  #pair input { width: 220px; font-size: 32px; letter-spacing: 8px; text-align: center; padding: 10px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--btn); color: var(--text); user-select: text; -webkit-user-select: text; }
  #pair button { width: 220px; padding: 14px; font-size: 16px; font-weight: 600; border: 0; border-radius: 14px; background: var(--text); color: var(--bg); }
  #pair .err { color: var(--err); min-height: 1.2em; }
  #msg { margin: auto; padding: 24px; text-align: center; color: var(--muted); line-height: 1.5; grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="dot"></span>
    <span id="now">Deck</span>
    <button id="full" aria-label="Tela cheia">⛶</button>
  </header>
  <main id="grid"></main>
  <nav id="tabs"></nav>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const params = new URLSearchParams(location.search);
let token = params.get('t') || store.get('deck_token') || '';
if (params.get('t')) { store.set('deck_token', token); history.replaceState(null, '', location.pathname); }

const iconUrls = {}, iconTried = new Set();
let config = null, status = {}, page = parseInt(store.get('deck_page') || '0', 10) || 0;

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Deck-Token': token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || ('Erro ' + res.status)); err.status = res.status; throw err; }
  return data;
}

let toastTimer;
function toast(text, isErr) {
  const t = $('toast');
  t.textContent = text; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', isErr ? 4000 : 1500);
}

function showMessage(html) { stopInfo(); $('grid').className = ''; $('grid').innerHTML = '<div id="msg">' + html + '</div>'; $('tabs').innerHTML = ''; }

function render() {
  if (!config) return;
  if (page >= config.pages.length) page = 0;
  const tabs = $('tabs'); tabs.innerHTML = '';
  config.pages.forEach((p, i) => {
    const b = document.createElement('button');
    b.textContent = p.name; b.className = i === page ? 'active' : '';
    b.onclick = () => { page = i; store.set('deck_page', i); render(); };
    tabs.appendChild(b);
  });
  const grid = $('grid');
  if (config.pages[page].type === 'info') { renderInfoShell(config.pages[page].cards); startInfo(); return; }
  stopInfo(); grid.className = ''; grid.innerHTML = '';
  config.pages[page].buttons.forEach((b) => {
    const el = document.createElement('button');
    el.className = 'btn'; el.dataset.id = b.id;
    if (b.color) el.style.setProperty('--c', b.color);
    if (b.color_on) el.style.setProperty('--on', b.color_on);
    el.innerHTML = '<span class="ic"></span><span class="lb"></span>';
    el.querySelector('.lb').textContent = b.label;
    el.onclick = () => press(el, b);
    grid.appendChild(el);
  });
  applyStatus();
}

// ---------------------------------------------------------------- tela de informações
const CARD_TITLES = { now: 'Agora', sys: 'Mac', claude: 'Claude Code', cal: 'Agenda', music: 'Tocando agora', rem: 'Lembretes' };
const CARD_SECTIONS = { now: ['weather'], sys: ['system'], claude: ['claude_sessions', 'claude_window'], cal: ['calendar'], music: ['music'], rem: ['reminders'] };
const DEFAULT_CARDS = ['now', 'sys', 'claude', 'cal'];
let info = null, infoAt = 0, infoTimer = null, clockTimer = null, infoCards = DEFAULT_CARDS, s21 = null;
const artUrls = {}, artTried = new Set();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dec = (n) => String(n).replace('.', ',');
function fmtTokens(n) { return n >= 1e6 ? dec((n / 1e6).toFixed(1)) + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' mil' : String(n); }
function fmtSpan(sec) { const m = Math.max(0, Math.round(sec / 60)); return m >= 60 ? Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min' : m + ' min'; }
function fmtAge(sec) { return sec < 90 ? 'agora' : 'há ' + fmtSpan(sec); }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + pad(sec % 60); }

if (navigator.getBattery) {   // só existe em páginas seguras (https); no Deck por http pode não aparecer
  navigator.getBattery().then((b) => { s21 = b; b.addEventListener('levelchange', drawInfo); b.addEventListener('chargingchange', drawInfo); }).catch(() => {});
}

function makeCard(id, title) {
  const c = el('section', 'card'); c.id = 'c-' + id;
  c.append(el('h3', null, title), el('div', 'body'));
  return c;
}

function renderInfoShell(cards) {
  infoCards = (cards && cards.length) ? cards : DEFAULT_CARDS; info = null;
  const g = $('grid'); g.className = 'info'; g.innerHTML = '';
  infoCards.forEach((id) => {
    const c = makeCard(id, CARD_TITLES[id] || id);
    if (id === 'now') c.querySelector('.body').append(el('div', 'clock'), el('div', 'date'), el('div', 'wx'));
    g.append(c);
  });
  updateClock(); drawInfo();
}

function updateClock() {
  const c = document.querySelector('#c-now .clock'); if (!c) return;
  const d = new Date();
  c.textContent = hhmm(d);
  document.querySelector('#c-now .date').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
}

function tickCountdown() {
  const cd = document.querySelector('.cd'); if (!cd) return;
  const now = Date.now() / 1000, start = +cd.dataset.start, end = +cd.dataset.end;
  cd.textContent = now >= start ? 'em andamento · até ' + hhmm(new Date(end * 1000))
    : start - now < 60 ? 'em menos de 1 min' : 'em ' + fmtSpan(start - now);
}

let musicNow = null;
function tickMusic() {
  const f = document.querySelector('.prog .fill'); if (!f || !musicNow) return;
  const m = musicNow;
  const pos = Math.min(m.dur || 0, m.pos + (m.state === 'playing' ? (Date.now() - infoAt) / 1000 : 0));
  f.style.width = (m.dur ? Math.min(100, 100 * pos / m.dur) : 0) + '%';
  const t = document.querySelector('.times'); if (t) t.replaceChildren(el('span', null, fmtClock(pos)), el('span', null, fmtClock(m.dur || 0)));
}

// devolve os dados prontos, ou escreve o estado (carregando / erro) e devolve null
function ready(box, name) {
  const s = info && info[name];
  if (!s) { box.append(el('div', 'dim', info ? 'desligado' : 'carregando…')); return null; }
  if (s.data != null) return s.data;
  box.append(el('div', s.error ? 'errtxt' : 'dim', s.error || 'carregando…'));
  return null;
}

function bar(label, pct, value) {
  const r = el('div', 'row'), top = el('div', 'rowtop'); top.append(el('span', 'lbl', label), el('span', 'val', value));
  const b = el('div', 'bar'), f = el('div', 'fill'); f.style.width = Math.min(100, pct) + '%';
  if (pct >= 85) f.classList.add('hot');
  b.append(f); r.append(top, b); return r;
}
function kv(k, v) { const r = el('div', 'kv'); r.append(el('span', 'k', k), el('span', 'v', v)); return r; }

function loadArt(key) {
  if (!key || artUrls[key] || artTried.has(key)) return;
  artTried.add(key);
  fetch('/api/art?k=' + encodeURIComponent(key), { headers: { 'X-Deck-Token': token } })
    .then((r) => { if (!r.ok) throw new Error('sem capa'); return r.blob(); })
    .then((b) => { artUrls[key] = URL.createObjectURL(b); drawInfo(); })
    .catch(() => { setTimeout(() => artTried.delete(key), 60000); });
}

function dayWord(d) { return d.toDateString() === new Date().toDateString() ? '' : 'amanhã '; }

function drawInfo() {
  const draw = (id, fn) => { const box = document.querySelector('#c-' + id + ' .body'); if (!box) return; const nodes = []; fn({ append: (...n) => nodes.push(...n) }); box.replaceChildren(...nodes); };
  const wx = document.querySelector('#c-now .wx');
  if (wx) {
    const out = []; const w = ready({ append: (...n) => out.push(...n) }, 'weather');
    if (w) {
      out.push(el('div', 'wxmain', w.icon + ' ' + w.temp + '° ' + w.text));
      out.push(el('div', 'dim', w.city + ' · máx ' + w.max + '° · mín ' + w.min + '°'));
      out.push(el('div', 'dim', 'Chance de chuva: ' + w.rain + '%'));
    }
    wx.replaceChildren(...out);
  }
  draw('sys', (box) => {
    const s = ready(box, 'system'); if (!s) return;
    box.append(bar('CPU', s.cpu, s.cpu + '%'), bar('Memória', s.mem_pct, dec(s.mem_used) + ' de ' + s.mem_total + ' GB'));
    const b = s.battery;
    if (b) box.append(kv('Bateria', b.pct + '% · ' + (b.charging ? '⚡ carregando' : b.plugged ? 'na tomada' : 'na bateria')));
    box.append(kv('Disco', s.disk_free + ' GB livres'));
    if (s21) box.append(kv('S21', Math.round(s21.level * 100) + '%' + (s21.charging ? ' · ⚡ carregando' : '')));
  });
  draw('claude', (box) => {
    const rows = ready(box, 'claude_sessions');
    if (rows) {
      if (!rows.length) box.append(el('div', 'dim', 'Nenhuma sessão ativa'));
      rows.forEach((r) => {
        const line = el('div', 'sess'); line.append(el('span', 'dotc' + (r.working ? ' work' : '')), el('span', 'nm', r.project), el('span', 'dim', r.working ? 'trabalhando' : fmtAge(r.age)));
        box.append(line);
      });
    }
    const w = info && info.claude_window && info.claude_window.data;
    if (w) {
      box.append(el('div', 'sep'));
      box.append(el('div', 'dim', 'Janela de 5 h'));
      if (w.active) {
        box.append(el('div', 'win', 'renova às ' + hhmm(new Date(w.end * 1000)) + ' (em ' + fmtSpan(w.end - Date.now() / 1000) + ')'));
        box.append(el('div', 'dim', w.messages + ' msgs · ' + fmtTokens(w.tokens) + ' tokens (estimativa)'));
      } else box.append(el('div', 'win', 'sem uso agora'));
    }
  });
  draw('cal', (box) => {
    const ev = ready(box, 'calendar'); if (!ev) return;
    if (!ev.length) { box.append(el('div', 'dim', 'Nada marcado para hoje e amanhã')); return; }
    const now = Date.now() / 1000;
    const first = ev.find((e) => !e.all_day && e.end > now);
    if (first) {
      const d = new Date(first.start * 1000);
      const cd = el('div', 'cd'); cd.dataset.start = first.start; cd.dataset.end = first.end;
      box.append(cd, el('div', 'nxt', first.title), el('div', 'dim', dayWord(d) + hhmm(d) + '–' + hhmm(new Date(first.end * 1000))));
    }
    const rest = ev.filter((e) => e !== first).slice(0, first ? 3 : 5);
    if (first && rest.length) box.append(el('div', 'sep'));
    rest.forEach((e) => {
      const d = new Date(e.start * 1000);
      const line = el('div', 'evt'); line.append(el('span', 'when', dayWord(d) + (e.all_day ? 'dia todo' : hhmm(d))), el('span', 'nm', e.title)); box.append(line);
    });
    tickCountdown();
  });
  draw('music', (box) => {
    const m = ready(box, 'music'); if (!m) return;
    if (m.state === 'off' || m.state === 'stopped') { musicNow = null; box.append(el('div', 'dim', m.state === 'off' ? 'O app de música está fechado' : 'Nada tocando')); return; }
    musicNow = m; loadArt(m.art);
    const wrap = el('div', 'mus'), art = el('div', 'art');
    if (m.art && artUrls[m.art]) { const im = new Image(); im.src = artUrls[m.art]; im.alt = ''; art.append(im); } else art.textContent = '🎵';
    const mi = el('div', 'mi');
    const prog = el('div', 'prog'); prog.append(el('div', 'fill'));
    mi.append(el('div', 'mt', m.title), el('div', 'ma', m.artist), el('div', 'dim', m.album), prog, el('div', 'times'));
    wrap.append(art, mi); box.append(wrap);
    setTimeout(tickMusic, 0);
  });
  draw('rem', (box) => {
    const r = ready(box, 'reminders'); if (!r) return;
    if (!r.total) { box.append(el('div', 'dim', 'Nenhuma tarefa para hoje')); return; }
    r.items.slice(0, 6).forEach((i) => {
      const line = el('div', 'rem' + (i.overdue ? ' late' : ''));
      line.append(el('span', 'dotc'), el('span', 'nm', i.title), el('span', 'dim', i.overdue ? 'atrasado' : i.has_time ? hhmm(new Date(i.due * 1000)) : 'hoje'));
      box.append(line);
    });
    if (r.total > 6) box.append(el('div', 'dim', '+' + (r.total - 6) + ' tarefas'));
  });
}

async function fetchInfo() {
  if (document.hidden) return;
  try {
    const names = infoCards.flatMap((c) => CARD_SECTIONS[c] || []);
    info = await api('/api/info?s=' + encodeURIComponent(names.join(',')));
    infoAt = Date.now(); $('dot').className = 'ok'; drawInfo();
  } catch (e) { $('dot').className = 'bad'; }
}
function startInfo() { stopInfo(); fetchInfo(); infoTimer = setInterval(fetchInfo, 4000); clockTimer = setInterval(() => { updateClock(); tickCountdown(); tickMusic(); }, 1000); }
function stopInfo() { clearInterval(infoTimer); clearInterval(clockTimer); infoTimer = clockTimer = null; }

function isOn(ind) {
  if (ind === 'mic_muted') return !!status.mic_muted;
  if (ind === 'sound_muted') return !!status.sound_muted;
  if (ind === 'music_playing') return status.player && status.player.state === 'playing';
  return false;
}

function setIcon(el, b, on) {
  const ic = el.querySelector('.ic'), url = b.icon_app && iconUrls[b.icon_app];
  if (url) {
    if (!ic.firstElementChild || ic.firstElementChild.tagName !== 'IMG') {
      ic.textContent = '';
      const im = new Image(); im.src = url; im.alt = ''; ic.appendChild(im);
    }
    return;
  }
  const name = (on && b.symbol_on) || b.symbol;   // ícone de linha (Lucide)
  if (name && /^[a-z0-9-]+$/.test(name)) {
    let sp = ic.firstElementChild;
    if (!sp || !sp.classList.contains('sym')) { ic.textContent = ''; sp = document.createElement('span'); sp.className = 'sym'; ic.appendChild(sp); }
    if (sp.dataset.name !== name) { sp.dataset.name = name; sp.style.setProperty('--m', 'url("/icons/' + name + '.svg")'); }
    return;
  }
  ic.textContent = (on && b.icon_on) ? b.icon_on : (b.icon || '');
}

function loadIcons() {
  config.pages.forEach((pg) => pg.buttons.forEach(async (b) => {
    const app = b.icon_app;
    if (!app || iconUrls[app] || iconTried.has(app)) return;
    iconTried.add(app);
    try {
      const res = await fetch('/api/icon?app=' + encodeURIComponent(app), { headers: { 'X-Deck-Token': token } });
      if (!res.ok) throw new Error('sem ícone');
      iconUrls[app] = URL.createObjectURL(await res.blob());
      applyStatus();
    } catch (e) { setTimeout(() => iconTried.delete(app), 60000); }
  }));
}

function applyStatus() {
  if (!config) return;
  config.pages[page].buttons.forEach((b) => {
    const el = document.querySelector('.btn[data-id="' + b.id + '"]');
    if (!el) return;
    const on = b.indicator ? isOn(b.indicator) : false;
    el.classList.toggle('on', on);
    setIcon(el, b, on);
  });
  const p = status.player;
  $('now').textContent = (p && p.title)
    ? (p.state === 'playing' ? '▶ ' : '⏸ ') + p.title + (p.artist ? ' — ' + p.artist : '')
    : 'Deck';
}

async function press(el, b) {
  if (navigator.vibrate) navigator.vibrate(15);
  try {
    const r = await api('/api/run', { id: b.id });
    el.classList.add('flash-ok');
    if (r.message && r.message !== 'OK') toast(r.message);
    refreshStatus();
  } catch (e) {
    el.classList.add('flash-err'); toast(e.message, true);
  }
  setTimeout(() => el.classList.remove('flash-ok', 'flash-err'), 400);
}

async function refreshStatus() {
  try { status = await api('/api/status'); $('dot').className = 'ok'; applyStatus(); }
  catch (e) { $('dot').className = 'bad'; }
}

function showPair(note) {
  config = null; stopInfo(); $('grid').className = ''; $('tabs').innerHTML = '';
  $('grid').innerHTML = '<form id="pair"><p>Digite o código de 6 dígitos que o Mac mostra.</p>' +
    '<input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autofocus>' +
    '<button type="submit">Parear</button><div class="err" id="pairErr"></div></form>';
  $('pairErr').textContent = note || '';
  $('pair').onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      const r = await api('/api/pair', { pin: $('pin').value.trim() });
      token = r.token; store.set('deck_token', token); loadConfig();
    } catch (e) { $('pairErr').textContent = e.message; }
  };
}

// ---------------------------------------------------------------- aparência (config.json → ui)
const BG_PRESETS = {
  midnight: 'linear-gradient(135deg, #0f2027, #203a43 55%, #2c5364)',
  aurora: 'radial-gradient(ellipse at 18% 12%, #1d6b5c 0, transparent 55%), radial-gradient(ellipse at 85% 85%, #4b2a7b 0, transparent 55%), #0b1020',
  sunset: 'linear-gradient(160deg, #2b1055, #7a2e5d 60%, #c4584c)',
  forest: 'linear-gradient(160deg, #0b1f17, #16402f 60%, #1f5a3c)',
};
let bgName = null, bgUrl = null;
async function applyUi(ui) {
  ui = ui || {};
  const root = document.documentElement, st = root.style;
  const num = (v, d, lo, hi) => { v = Number(v); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
  st.setProperty('--bh', num(ui.button_height, 128, 64, 260) + 'px');
  st.setProperty('--bw', num(ui.button_min_width, 150, 90, 300) + 'px');
  st.setProperty('--ic', num(ui.icon_size, 46, 20, 96) + 'px');
  st.setProperty('--dim', num(ui.dim, 0.5, 0, 0.9));
  root.classList.toggle('no-labels', ui.labels === false);
  const bg = String(ui.background || '').trim();
  if (bg === bgName) return;
  bgName = bg;
  if (!bg) { root.classList.remove('has-bg'); return; }
  if (BG_PRESETS[bg]) { st.setProperty('--bg-img', BG_PRESETS[bg]); root.classList.add('has-bg'); return; }
  try {
    const res = await fetch('/api/bg?f=' + encodeURIComponent(bg), { headers: { 'X-Deck-Token': token } });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || 'Erro ' + res.status); }
    if (bgUrl) URL.revokeObjectURL(bgUrl);
    bgUrl = URL.createObjectURL(await res.blob());
    st.setProperty('--bg-img', 'url("' + bgUrl + '")'); root.classList.add('has-bg');
  } catch (e) { root.classList.remove('has-bg'); bgName = null; toast(e.message, true); }
}

async function loadConfig() {
  if (!token) return showPair();
  try { config = await api('/api/config'); applyUi(config.ui); render(); refreshStatus(); loadIcons(); }
  catch (e) {
    if (e.status === 401) { token = ''; store.set('deck_token', ''); return showPair('Pareie de novo.'); }
    showMessage('Sem conexão com o Mac.<br><small>' + e.message + '</small>'); $('dot').className = 'bad';
  }
}

$('full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadConfig(); });
loadConfig();
setInterval(() => { if (!document.hidden && config) refreshStatus(); }, 2500);
</script>
